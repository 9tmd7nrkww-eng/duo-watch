name: Duo watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "watch, discover or test"
        default: "watch"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: duo_stock_state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PARTS: ${{ vars.PARTS }}
          MODE: ${{ inputs.mode || 'watch' }}
        run: |
          MODE=$(echo "$MODE" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
          if [ "$MODE" = "test" ]; then python duo_stock_watch.py --test
          elif [ "$MODE" = "discover" ] || [ -z "$PARTS" ]; then python duo_stock_watch.py --discover
          else python duo_stock_watch.py --once
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: duo_stock_state.json
          key: duo-state-${{ github.run_id }}
